<style>
/* 版面：手機直式。上方標題列 → 中間比例尺舞台（共用地面線）→ 下方操作面板 */
:root{
  --bg:#0d0f14;
  --stage:#121620;
  --line:#262c3a;
  --fg:#f2efe6;
  --muted:#8c93a5;
  --accent:#ffd23a;       /* 獵人執照黃：把手、按鈕、正確身高 */
  --guess:#5ce1e6;        /* 玩家猜的高度 */
  --ok:#2fbf71;
  --bad:#ff6b6b;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --num:'Bebas Neue','Noto Sans TC',Impact,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%; margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans);
  overscroll-behavior:none; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%}
body{overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* 整個 App 固定在 9:16，置中；手機上直接填滿 */
.app{position:relative; height:100%; max-width:calc(100dvh * 9 / 16); margin:0 auto; display:grid; grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top,0px) max(12px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px, env(safe-area-inset-left,0px))}

.top{display:flex; align-items:center; gap:10px; padding:10px 2px 8px}
.brand{display:grid; line-height:1}
.kick{font-family:var(--num); letter-spacing:.18em; font-size:12px; color:var(--accent)}
.title{font-weight:900; font-size:20px; margin-top:2px}
.round{margin-left:auto; font-family:var(--num); font-size:22px; letter-spacing:.06em; color:var(--muted)}
.icon-btn{border:1px solid var(--line); background:transparent; border-radius:99px; padding:6px 12px; font-size:13px; font-weight:700}

/* 舞台 */
.stage{position:relative; min-height:0; background:
  radial-gradient(120% 60% at 50% 0%, rgba(255,210,58,.06), transparent 60%), var(--stage);
  border:1px solid var(--line); border-radius:16px; overflow:hidden; touch-action:pan-x}
.grid{position:absolute; inset:0; pointer-events:none}
.grid i{position:absolute; left:0; right:0; height:1px; background:rgba(255,255,255,.05)}
.grid i.major{background:rgba(255,255,255,.09)}
.ruler{position:absolute; left:0; top:0; bottom:0; width:40px; z-index:3; pointer-events:none;
  background:linear-gradient(90deg, var(--stage) 70%, transparent)}
.ruler .t{position:absolute; left:0; height:1px; background:var(--muted); opacity:.6}
.ruler .t.major{opacity:1}
.ruler .l{position:absolute; left:4px; transform:translateY(-120%); font-family:var(--num); font-size:13px; color:var(--muted); letter-spacing:.04em}
.ground{position:absolute; left:0; right:0; height:2px; background:var(--accent); box-shadow:0 0 12px rgba(255,210,58,.5); z-index:2; pointer-events:none}

/* 角色排排站：可以左右滑 */
.lineup{position:absolute; inset:0 0 0 40px; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x proximity;
  scrollbar-width:none; -webkit-overflow-scrolling:touch; z-index:1; touch-action:pan-x; overscroll-behavior-x:contain}
.lineup::-webkit-scrollbar{display:none}
.col{position:relative; flex:none; height:100%; scroll-snap-align:center}
.col.current{touch-action:none; cursor:ns-resize}
.fig{position:absolute; left:50%; transform:translateX(-50%); display:block; max-width:none; pointer-events:none;
  transition:height .7s cubic-bezier(.2,.9,.25,1.15), bottom .7s cubic-bezier(.2,.9,.25,1.15);
  -webkit-user-drag:none; filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.app.dragging .fig{transition:none}
.tag{position:absolute; left:0; right:0; text-align:center; padding-bottom:6px; pointer-events:none;
  transition:bottom .7s cubic-bezier(.2,.9,.25,1.15)}
.app.dragging .tag{transition:none}
.tag .n{display:block; font-weight:900; font-size:13px}
.tag .h{display:inline-block; font-family:var(--num); font-size:20px; letter-spacing:.04em; color:var(--accent); line-height:1}
.tag .h.pending{color:var(--muted); font-size:15px}
.tag .h small{font-size:.6em}
.col.current .tag{display:none}
.name-under{display:none}
/* 全員比較：名字移到地面線下，標籤只留數字 */
.app.all .tag .n{display:none}
.app.all .tag .h small{display:none}
.app.all .tag .h.pending{font-size:12px}
.app.all .name-under{display:block; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 2px}
.app.all .guessline span{display:none}
.app.all .guessline{left:6%; right:6%}
.name-under{position:absolute; left:0; right:0; text-align:center; font-size:12px; font-weight:700; color:var(--muted); pointer-events:none}
.guessline{position:absolute; left:10%; right:10%; height:0; border-top:2px dashed var(--guess); opacity:.9; pointer-events:none}
.guessline span{position:absolute; right:0; top:-18px; font-family:var(--num); font-size:14px; color:var(--guess)}

/* 目前角色的把手 */
.handle{position:absolute; left:4%; right:4%; height:0; pointer-events:none}
.handle::before{content:""; position:absolute; left:0; right:0; top:-1px; border-top:2px solid var(--guess)}
.knob{position:absolute; left:50%; top:0; transform:translate(-50%,-50%); width:46px; height:46px; border-radius:50%;
  background:var(--guess); color:#04191a; display:grid; place-items:center; font-weight:900; font-size:18px;
  box-shadow:0 0 0 6px rgba(92,225,230,.18), 0 6px 16px rgba(0,0,0,.4)}
.handle .val{position:absolute; right:0; top:-26px; font-family:var(--num); font-size:22px; color:var(--guess); letter-spacing:.04em}
.col.current.locked{cursor:default}

.swipe-hint{position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:4; font-size:12px; color:var(--muted);
  background:rgba(13,15,20,.8); border:1px solid var(--line); padding:4px 10px; border-radius:99px; pointer-events:none}

.fit-btn{position:absolute; right:10px; top:10px; z-index:4; border:1px solid var(--line); background:rgba(13,15,20,.85); color:var(--fg);
  border-radius:99px; padding:6px 12px; font-size:13px; font-weight:700}
/* 縮小看全部：左右留空間給超出欄位的立繪，不捲動 */
.app.fit .lineup{overflow-x:hidden; padding:0 24px}
input.scrub{grid-column:1 / -1; width:100%; height:36px; accent-color:var(--accent); touch-action:none; margin:0}

/* 下方面板 */
.panel{display:grid; grid-template-columns:1fr auto; align-items:center; gap:6px 12px; padding:12px 2px 14px}
.who{display:flex; align-items:center; gap:8px; min-width:0}
.name{font-weight:900; font-size:22px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.badge{font-size:11px; font-weight:700; color:var(--muted); border:1px solid var(--line); padding:2px 8px; border-radius:99px; white-space:nowrap}
.readout{font-family:var(--num); font-size:40px; line-height:1; color:var(--guess); letter-spacing:.04em; text-align:right}
.readout small{font-size:18px; margin-left:2px; color:var(--muted)}
.readout.final{color:var(--accent)}
input[type=range]{grid-column:1 / -1; width:100%; height:36px; accent-color:var(--guess); touch-action:none; margin:0}
.hint{grid-column:1 / -1; font-size:13px; color:var(--muted); min-height:1.4em}
.hint b{color:var(--fg)}
.hint .good{color:var(--ok)} .hint .off{color:var(--bad)}
.actions{grid-column:1 / -1; display:grid}
.btn{border:1px solid var(--line); background:transparent; border-radius:14px; padding:14px 18px; font-weight:900; font-size:17px; text-align:center; text-decoration:none; color:var(--fg)}
.btn.primary{background:var(--accent); color:#1a1500; border-color:var(--accent)}
.btn:active{transform:scale(.98)}

/* 結算 */
.overlay{position:fixed; inset:0; z-index:20; background:rgba(5,6,9,.78); backdrop-filter:blur(4px); display:grid; place-items:center;
  padding:max(16px, env(safe-area-inset-top,0px)) 16px max(16px, env(safe-area-inset-bottom,0px)); overflow-y:auto; touch-action:pan-y}
.sheet{width:min(440px,100%); background:#161a24; border:1px solid var(--line); border-radius:20px; padding:20px; display:grid; gap:10px; text-align:center}
.avg{font-family:var(--num); font-size:72px; line-height:.9; color:var(--accent)}
.avg small{font-size:26px; color:var(--muted)}
.avg-label{font-size:12px; color:var(--muted)}
.rank{font-weight:900; font-size:22px}
.table{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
.table th{font-size:12px; color:var(--muted); font-weight:700; padding:6px 4px; border-bottom:1px solid var(--line)}
.table td{padding:7px 4px; border-bottom:1px solid rgba(255,255,255,.05)}
.table td:first-child{text-align:left; font-weight:700}
.table .pend td{color:var(--muted)}
.table .good{color:var(--ok)} .table .off{color:var(--bad)}
.note{font-size:12px; color:var(--muted); line-height:1.5}
.sheet-actions{display:grid; gap:8px}
.story-sheet img{width:100%; border-radius:12px; border:1px solid var(--line); -webkit-touch-callout:default; user-select:auto}

/* 頭像設定 */
.top .icon-btn + .icon-btn{margin-left:-4px}
.faces-sheet{text-align:left}
.face-list{display:grid; gap:8px; max-height:52vh; overflow-y:auto}
.face-row{display:grid; grid-template-columns:48px 1fr auto auto auto; align-items:center; gap:8px}
.face-row .av{width:48px; height:48px}
.btn.sm{padding:8px 12px; font-size:14px; border-radius:10px}
.btn.ghost{border-color:transparent; color:var(--muted)}
.face-edit{display:grid; justify-items:center; gap:10px}
#faceCanvas{width:240px; height:240px; border-radius:50%; background:#0d0f14; outline:3px solid var(--guess); touch-action:none; cursor:grab}
.zoom{display:flex; align-items:center; gap:10px; width:100%; font-size:14px; color:var(--muted)}
.zoom input{flex:1; accent-color:var(--guess)}
.sheet-actions.two{grid-template-columns:1fr 1fr; width:100%}

.toast{position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:30; background:#1c2130; border:1px solid var(--line);
  padding:8px 14px; border-radius:99px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ .fig,.tag{transition:none!important} }

/* =========================================================
   正方形版面（電腦、橫向螢幕自動套用；網址加 ?sq=1 強制）
   上：標題列　下左：比例尺舞台　下右：操作面板
   ========================================================= */
html.sq body{display:grid; place-items:center}
html.sq .app{--s:min(100vw, 100dvh); width:var(--s); height:var(--s); max-width:none; margin:0;
  grid-template-columns:1fr calc(var(--s) * .30); grid-template-rows:auto 1fr; grid-template-areas:"top top" "stage panel";
  column-gap:calc(var(--s) * .022); padding:calc(var(--s) * .022); padding-top:0}
html.sq .top{grid-area:top; padding:calc(var(--s) * .018) 2px calc(var(--s) * .014)}
html.sq .kick{font-size:calc(var(--s) * .02)}
html.sq .title{font-size:calc(var(--s) * .036)}
html.sq .round{font-size:calc(var(--s) * .036)}
html.sq .icon-btn{font-size:calc(var(--s) * .022); padding:calc(var(--s) * .008) calc(var(--s) * .02)}
html.sq .stage{grid-area:stage}
html.sq .panel{grid-area:panel; grid-template-columns:1fr; align-content:end; gap:calc(var(--s) * .016); padding:0; min-height:0}
html.sq .who{flex-wrap:wrap; gap:calc(var(--s) * .01)}
html.sq .name{font-size:calc(var(--s) * .044); white-space:normal; line-height:1.2}
html.sq .badge{font-size:calc(var(--s) * .018)}
html.sq .readout{text-align:left; font-size:calc(var(--s) * .1)}
html.sq .readout small{font-size:calc(var(--s) * .035)}
html.sq .hint{font-size:calc(var(--s) * .022); line-height:1.5; min-height:4.5em}
html.sq .btn{font-size:calc(var(--s) * .03); padding:calc(var(--s) * .022) calc(var(--s) * .02); border-radius:calc(var(--s) * .02)}
html.sq input[type=range]{height:calc(var(--s) * .05)}
html.sq .fit-btn,html.sq .swipe-hint{font-size:calc(var(--s) * .02)}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="kick">HUNTER × HUNTER</div>
      <div class="title">身高挑戰</div>
    </div>
    <div class="round" id="round">1 / 8</div>
    <button class="icon-btn" id="facesBtn" aria-label="設定角色頭像">頭像</button>
    <button class="icon-btn" id="restartBtn" aria-label="重新開始">重來</button>
  </header>

  <main class="stage" id="stage">
    <div class="grid" id="grid"></div>
    <div class="ruler" id="ruler"></div>
    <div class="lineup" id="lineup"></div>
    <div class="ground" id="ground"></div>
    <button class="fit-btn" id="fitBtn" hidden>縮小看全部</button>
    <div class="swipe-hint" id="swipeHint" hidden>← 左右滑動看前面的角色</div>
  </main>

  <section class="panel" id="panel">
    <div class="who">
      <div class="name" id="who"></div>
      <div class="badge" id="badge" hidden>練習・不計分</div>
    </div>
    <div class="readout"><span id="guessCm">150</span><small>cm</small></div>
    <input type="range" id="slider" min="100" max="230" step="1" value="150" aria-label="調整身高">
    <input type="range" id="scrub" class="scrub" min="0" max="1000" step="1" value="0" aria-label="左右捲動看全部角色" hidden>
    <div class="hint" id="hint">拖動角色頭頂的把手，或滑動下面的滑桿</div>
    <div class="actions">
      <button class="btn primary" id="confirmBtn">確定</button>
      <button class="btn primary" id="nextBtn" hidden>下一位 →</button>
    </div>
  </section>
</div>

<div class="overlay" id="result" hidden>
  <div class="sheet">
    <div class="kick">你的身高眼力</div>
    <div class="avg"><span id="avgErr">0</span><small> cm</small></div>
    <div class="avg-label">平均誤差</div>
    <div class="rank" id="rank"></div>
    <table class="table"><thead><tr><th>角色</th><th>你猜</th><th>實際</th><th>誤差</th></tr></thead><tbody id="rows"></tbody></table>
    <div class="note" id="pendingNote"></div>
    <div class="sheet-actions">
      <button class="btn primary" id="storyBtn">產生 IG 限動圖</button>
      <button class="btn" id="viewAllBtn">看全員比較</button>
      <button class="btn" id="againBtn">再玩一次</button>
    </div>
    <div class="sheet-actions two" style="margin-top:4px">
      <a class="btn ghost sm" id="igBtn" href="https://www.instagram.com/whatistruthqq/" target="_blank" rel="noopener">追蹤 IG</a>
      <a class="btn ghost sm" id="moreBtn" href="../">← 更多獵人遊戲</a>
    </div>
  </div>
</div>

<div class="overlay" id="story" hidden>
  <div class="sheet story-sheet">
    <img id="storyImg" alt="身高挑戰結果圖">
    <div class="note">手機：長按圖片儲存　電腦：按下面的按鈕下載</div>
    <div class="sheet-actions">
      <a class="btn primary" id="storyDl" download="hxh-height-result.png">下載圖片</a>
      <button class="btn" id="storyClose">關閉</button>
    </div>
  </div>
</div>

<div class="overlay" id="faces" hidden>
  <div class="sheet faces-sheet">
    <div class="rank">角色頭像</div>
    <div class="note">選一張有角色臉的截圖，拖曳照片把臉對到圓圈中間。照片只存在這台裝置的瀏覽器，不會上傳。</div>
    <div id="faceList" class="face-list"></div>
    <div id="faceEdit" class="face-edit" hidden>
      <b id="faceEditName"></b>
      <canvas id="faceCanvas" width="240" height="240" aria-label="拖曳調整臉的位置"></canvas>
      <label class="zoom">放大 <input type="range" id="faceZoom" min="0" max="85" value="0"></label>
      <div class="sheet-actions two">
        <button class="btn" id="faceCancel">取消</button>
        <button class="btn primary" id="faceSave">存</button>
      </div>
    </div>
    <button class="btn" id="facesClose">完成</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   角色資料
   - id         ：英文代號，也用來對應 image-config.js 的校準設定
   - name       ：顯示名稱
   - heightCm   ：身高（公分）。查不到就填 null，這個角色不會出現在遊戲裡
   - imagePath  ：去背立繪的路徑（PNG / WebP，透明背景）。檔案不存在時會自動用佔位剪影
   - facePath   ：（選填）臉部截圖，預設 images/faces/<id>.jpg。沒有全身立繪時會變成剪影的大頭貼
   - source     ：身高出處
   - verified   ：true = 有官方出處，會計分
                  false = 待確認，只當練習題，不計分（heightCm 為 null 時完全不出現）
   ========================================================= */
window.CHARACTERS = [
  { id:'gon',      name:'小傑',     heightCm:154,  imagePath:'images/gon.webp',      verified:true,
    source:'《ハンター協会公式発行 ハンターズ・ガイド》（集英社，2004）' },
  { id:'killua',   name:'奇犽',     heightCm:158,  imagePath:'images/killua.webp',   verified:true,
    source:'《ハンター協会公式発行 ハンターズ・ガイド》（集英社，2004）' },
  { id:'kurapika', name:'酷拉皮卡', heightCm:171,  imagePath:'images/kurapika.webp', verified:true,
    source:'《ハンター協会公式発行 ハンターズ・ガイド》（集英社，2004）' },
  { id:'leorio',   name:'雷歐力',   heightCm:193,  imagePath:'images/leorio.webp',   verified:true,
    source:'《ハンター協会公式発行 ハンターズ・ガイド》（集英社，2004）' },
  { id:'hisoka',   name:'西索',     heightCm:187,  imagePath:'images/hisoka.webp',   verified:true,
    source:'《ハンター協会公式発行 ハンターズ・ガイド》（集英社，2004）' },
  { id:'illumi',   name:'伊爾謎',   heightCm:185,  imagePath:'images/illumi.webp',   verified:true,
    source:'網路常見數字（粉絲整理的身高表、fictionhorizon 等），非官方設定' },
  { id:'chrollo',  name:'庫洛洛',   heightCm:177,  imagePath:'images/chrollo.webp',  verified:true,
    source:'網路常見數字（粉絲整理的身高表、fictionhorizon 等），非官方設定' },
  { id:'feitan',   name:'飛坦',     heightCm:155,  imagePath:'images/feitan.webp',   verified:true,
    source:'網路常見數字（粉絲整理的身高表、fictionhorizon 等），非官方設定' },
  { id:'biscuit',  name:'比司吉',   heightCm:null, imagePath:'images/biscuit.webp',  verified:false,
    source:'待確認：查不到官方身高' },
  { id:'netero',   name:'尼特羅',   heightCm:null, imagePath:'images/netero.webp',   verified:false,
    source:'待確認：查不到官方身高' },
];

(function () {
  const PALETTE = ['#5ad19a', '#7fb8ff', '#ffd166', '#c39bff', '#ff8fa3', '#7ee0e6', '#ffa36b', '#b5e48c', '#f4a261', '#9ab0c9'];
  const S = 3;                    // 輸出解析度倍數（300 × 900）

  /* face：已載入的 Image（可為 null）；crop：{x, y, z} 臉的中心（0~1）與縮放（1 = 整張短邊） */
  window.makeFigure = function (ch, index, face, crop) {
    const color = PALETTE[index % PALETTE.length];
    const h = ch.heightCm || 170;
    const kid = h < 165;
    const headR = face ? (kid ? 34 : 30) : (kid ? 25 : 21);   // 有照片時頭大一點，臉才看得清楚
    const top = 6, foot = 294;
    const headCy = top + headR;
    const neck = headCy + headR - 2;
    const shoulderY = neck + 10;
    const hip = shoulderY + (foot - shoulderY) * 0.42;

    const c = document.createElement('canvas');
    c.width = 100 * S; c.height = 300 * S;
    const g = c.getContext('2d');
    g.scale(S, S);
    g.fillStyle = color;
    const paths = [
      `M44 ${neck - 4} h12 v14 h-12 Z`,
      `M22 ${shoulderY + 8} Q22 ${shoulderY} 32 ${shoulderY} L68 ${shoulderY} Q78 ${shoulderY} 78 ${shoulderY + 8} L74 ${hip} L26 ${hip} Z`,
      `M22 ${shoulderY + 6} L12 ${hip + 18} L19 ${hip + 20} L30 ${shoulderY + 16} Z`,
      `M78 ${shoulderY + 6} L88 ${hip + 18} L81 ${hip + 20} L70 ${shoulderY + 16} Z`,
      `M27 ${hip - 2} L48 ${hip - 2} L46 ${foot - 4} L44 ${foot} L30 ${foot} L31 ${foot - 4} Z`,
      `M52 ${hip - 2} L73 ${hip - 2} L69 ${foot - 4} L70 ${foot} L56 ${foot} L54 ${foot - 4} Z`,
    ];
    paths.forEach(p => g.fill(new Path2D(p)));

    // 頭
    g.save();
    g.beginPath(); g.arc(50, headCy, headR, 0, Math.PI * 2); g.closePath();
    if (face && face.naturalWidth) {
      g.clip();
      const cr = Object.assign({ x: 0.5, y: 0.5, z: 1 }, crop);
      const side = Math.min(face.naturalWidth, face.naturalHeight) * Math.max(0.15, Math.min(1, cr.z));
      let sx = cr.x * face.naturalWidth - side / 2, sy = cr.y * face.naturalHeight - side / 2;
      sx = Math.max(0, Math.min(face.naturalWidth - side, sx));
      sy = Math.max(0, Math.min(face.naturalHeight - side, sy));
      g.drawImage(face, sx, sy, side, side, 50 - headR, headCy - headR, headR * 2, headR * 2);
      g.restore();
      g.beginPath(); g.arc(50, headCy, headR - 1, 0, Math.PI * 2);
      g.lineWidth = 2; g.strokeStyle = color; g.stroke();
    } else {
      g.fill();
      g.restore();
      g.fillStyle = '#111'; g.font = '900 20px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('?', 50, headCy + 1);
    }
    return c;
  };
})();

</script>
<script>
/* =========================================================
   獵人身高挑戰：遊戲邏輯
   - 所有角色共用同一個「每公分幾像素」（pxPerCm），腳底對齊同一條地面線
   - 角色資料在 characters.js，圖片校準在 image-config.js
   ========================================================= */
(function () {
  'use strict';

  function track(name, p){ try{ if(typeof gtag === 'function') gtag('event', name, p || {}); }catch(e){} }
  document.getElementById('igBtn').addEventListener('click', () => track('ig_click', {location:'end'}));
  document.getElementById('moreBtn').addEventListener('click', () => track('more_games_click'));

  /* 正方形版面：電腦或橫向螢幕自動切換；網址 ?sq=1 強制正方形、?sq=0 強制直式 */
  const SQ_PARAM = new URLSearchParams(location.search).get('sq');
  const sqMQ = window.matchMedia('(min-aspect-ratio: 4/5)');
  function applySquare() {
    const on = SQ_PARAM === '1' ? true : SQ_PARAM === '0' ? false : sqMQ.matches;
    document.documentElement.classList.toggle('sq', on);
  }
  applySquare();
  if (sqMQ.addEventListener) sqMQ.addEventListener('change', applySquare);

  /* ---------- 可調參數 ---------- */
  const MAX_CM = 230;          // 比例尺最上面的刻度
  const MIN_GUESS = 100;       // 滑桿最小值
  const MAX_GUESS = 230;       // 滑桿最大值
  const START_GUESS = 150;     // 每一題一開始的高度（刻意不給提示）
  const TOP_PAD = 52;          // 舞台上方留給名字標籤的空間（px）
  const GROUND_GAP = 30;       // 地面線到舞台底部的距離（px），用來放名字
  const RULER_W = 40;          // 左側尺規寬度（px）
  const CALIB_KEY = 'hxhHeight.calibration';   // calibrate.html 存的校準覆寫

  /* ---------- 小工具 ---------- */
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function readCalibOverrides() { try { return JSON.parse(localStorage.getItem(CALIB_KEY)) || {}; } catch (e) { return {}; } }

  /* ---------- 資料 ---------- */
  const ALL = (window.CHARACTERS || []).map((c, i) => ({ ...c, index: i }));
  const PLAYABLE = ALL.filter(c => typeof c.heightCm === 'number' && c.heightCm > 0);
  const PENDING_NO_HEIGHT = ALL.filter(c => !(typeof c.heightCm === 'number' && c.heightCm > 0));
  const IMAGES = {};           // id -> { src, w, h, real, el }

  /* ---------- 狀態 ---------- */
  let order = [];              // 本局出題順序
  let idx = 0;                 // 目前第幾位
  let guess = START_GUESS;     // 目前猜的高度
  let locked = false;          // 這一題是否已經按了確定
  let guesses = {};            // id -> 玩家猜的公分
  let viewAll = false;         // 結束後的全員比較模式
  let geo = null;              // 舞台幾何資料
  let fitAll = false;          // 全員比較：true = 縮小塞進一個畫面

  const stage = $('stage'), lineup = $('lineup'), app = $('app');

  /* ---------- 圖片載入 ----------
     1. 有全身去背立繪（imagePath）就用立繪
     2. 沒有的話：彩色剪影＋圓形大頭貼。大頭貼來源依序是
        玩家在「頭像」裡上傳的照片（存在這台裝置）→ images/faces/<id>.jpg → 問號 */
  const FACE_KEY = 'hxhHeight.faces';
  function readFaces() { try { return JSON.parse(localStorage.getItem(FACE_KEY)) || {}; } catch (e) { return {}; } }
  function writeFaces(f) { try { localStorage.setItem(FACE_KEY, JSON.stringify(f)); return true; } catch (e) { toast('空間不足，照片存不進去，換小一點的圖試試'); return false; } }
  const facePathOf = ch => ch.facePath || `images/faces/${ch.id}.jpg`;
  function loadFile(src) {
    return new Promise(res => {
      if (!src) return res(null);
      const img = new Image();
      img.decoding = 'async';
      img.onload = () => res(img);
      img.onerror = () => res(null);
      img.src = src;
    });
  }
  function faceInfo(ch) {
    const saved = readFaces()[ch.id];
    if (saved && saved.data) return { src: saved.data, crop: saved };
    return { src: facePathOf(ch), crop: (window.FACE_CONFIG || {})[ch.id] };
  }
  async function loadFigure(ch) {
    const real = await loadFile(ch.imagePath);
    if (real) return { src: ch.imagePath, w: real.naturalWidth, h: real.naturalHeight, real: true, el: real };
    const fi = faceInfo(ch);
    const face = await loadFile(fi.src);
    let src;
    try { src = window.makeFigure(ch, ch.index, face, fi.crop).toDataURL('image/png'); }
    catch (e) { src = window.makeFigure(ch, ch.index, null).toDataURL('image/png'); }   // 本機檔案開啟時可能被瀏覽器擋
    const el = await loadFile(src);
    return { src, w: 100, h: 300, real: false, el, hasFace: !!face };
  }
  async function refreshFigure(ch) {
    IMAGES[ch.id] = await loadFigure(ch);
    lineup.querySelectorAll(`.col[data-id="${ch.id}"] .fig`).forEach(img => { img.src = IMAGES[ch.id].src; });
    if (order.length) layout();
  }
  function calibOf(ch) {
    const im = IMAGES[ch.id];
    if (!im || !im.real) return window.PLACEHOLDER_CALIB;
    const o = readCalibOverrides()[ch.id] || (window.IMAGE_CONFIG || {})[ch.id] || {};
    const top = clamp(Number.isFinite(o.top) ? o.top : 0, 0, 0.9);
    const bottom = clamp(Number.isFinite(o.bottom) ? o.bottom : 1, top + 0.05, 1);
    return { top, bottom };
  }

  /* ---------- 幾何 ---------- */
  function measure() {
    // 用內部尺寸（不含邊框），角色和地面線才會用同一個座標系
    const r = stage.getBoundingClientRect();
    const H = stage.clientHeight, W = stage.clientWidth;
    const groundY = H - GROUND_GAP;                       // 地面線的 y（舞台座標，往下為正）
    const pxPerCm = (groundY - TOP_PAD) / MAX_CM;         // 所有角色共用
    const shown = viewAll ? order.length : Math.min(idx + 1, order.length);
    const usable = W - RULER_W;
    const colW = viewAll ? Math.max(30, usable / Math.max(1, shown)) : Math.max(120, usable * 0.5);
    geo = { H, W, groundY, pxPerCm, colW, top: r.top + stage.clientTop };
    return geo;
  }
  const yOfCm = cm => geo.groundY - cm * geo.pxPerCm;       // 某個公分數在舞台上的 y

  /* 背景格線與尺規 */
  function drawRuler() {
    const grid = $('grid'), ruler = $('ruler');
    let g = '', r = '';
    for (let cm = 0; cm <= MAX_CM; cm += 10) {
      const y = yOfCm(cm), major = cm % 50 === 0;
      if (cm > 0) g += `<i class="${major ? 'major' : ''}" style="top:${y}px"></i>`;
      r += `<div class="t ${major ? 'major' : ''}" style="top:${y}px; width:${major ? 14 : 8}px"></div>`;
      if (major && cm > 0) r += `<div class="l" style="top:${y}px">${cm}</div>`;
    }
    grid.innerHTML = g; ruler.innerHTML = r;
    $('ground').style.top = (geo.groundY - 1) + 'px';
  }

  /* ---------- 畫面 ---------- */
  function tagInner(ch) {
    return `<span class="n">${esc(ch.name)}</span><span class="h ${ch.verified ? '' : 'pending'}">${ch.verified ? ch.heightCm + '<small> cm</small>' : '待確認'}</span>`;
  }
  function columnHTML(ch, state) {
    const im = IMAGES[ch.id];
    const tag = state === 'current'
      ? `<div class="tag"><span class="n">${esc(ch.name)}</span></div>`
      : `<div class="tag">${tagInner(ch)}</div>`;
    const extra = state === 'current'
      ? `<div class="handle"><div class="val"></div><div class="knob">⇕</div></div>`
      : `<div class="guessline"><span></span></div>`;
    return `<div class="col ${state === 'current' ? 'current' : ''}" data-id="${ch.id}">
      <img class="fig" src="${im.src}" alt="" draggable="false">
      ${tag}${extra}
      <div class="name-under">${esc(ch.name)}</div>
    </div>`;
  }
  function build() {
    app.classList.toggle('all', viewAll);
    measure();
    drawRuler();
    const list = viewAll ? order : order.slice(0, idx + 1);
    lineup.innerHTML = list.map((ch, i) => columnHTML(ch, !viewAll && i === idx && !locked ? 'current' : 'done')).join('');
    if (!viewAll && locked) lineup.lastElementChild.classList.add('current', 'locked');
    layout();
  }
  /* 依目前狀態擺好每個角色的大小和位置（拖曳時只呼叫這個） */
  function layout() {
    if (!geo) measure();
    const cols = lineup.children;
    for (const col of cols) {
      const ch = ALL.find(c => c.id === col.dataset.id);
      const isCurrent = !viewAll && col === lineup.lastElementChild && order[idx] && ch.id === order[idx].id;
      const showCm = isCurrent && !locked ? guess : ch.heightCm;
      const { top, bottom } = calibOf(ch);
      const figPx = showCm * geo.pxPerCm;                     // 頭頂到腳底的像素
      const imgH = figPx / (bottom - top);                    // 整張圖要多高
      const img = col.querySelector('.fig');
      // 全員比較：依立繪實際寬度排，彼此稍微重疊，太寬就左右滑
      const im = IMAGES[ch.id];
      const usable = geo.W - RULER_W;
      col.style.width = (viewAll ? (fitAll ? Math.max(24, Math.floor((usable - 48) / order.length)) : Math.max(44, imgH * im.w / im.h * 0.72)) : geo.colW) + 'px';
      img.style.height = imgH + 'px';
      img.style.width = 'auto';                                // 維持原始長寬比
      img.style.bottom = (GROUND_GAP - (1 - bottom) * imgH) + 'px'; // 讓「腳底」那條線剛好落在地面
      col.querySelector('.name-under').style.bottom = (GROUND_GAP - 22) + 'px';
      const tag = col.querySelector('.tag');
      tag.style.bottom = (GROUND_GAP + figPx + 4) + 'px';
      tag.style.fontSize = viewAll && geo.colW < 70 ? '11px' : '';
      const handle = col.querySelector('.handle');
      if (handle) {
        handle.style.top = yOfCm(guess) + 'px';
        handle.querySelector('.val').textContent = guess + ' cm';
        handle.hidden = locked;
      }
      const gl = col.querySelector('.guessline');
      if (gl) {
        const g = guesses[ch.id];
        gl.hidden = !(g > 0);
        if (g > 0) { gl.style.top = yOfCm(g) + 'px'; gl.querySelector('span').textContent = '猜 ' + g; }
      }
    }
  }

  /* 全員比較的捲動條：內容比畫面寬才出現 */
  function syncScrub() {
    const max = lineup.scrollWidth - lineup.clientWidth;
    $('scrub').hidden = !viewAll || fitAll || max < 4;
    if (max >= 4) $('scrub').value = Math.round(lineup.scrollLeft / max * 1000);
  }
  $('scrub').addEventListener('input', e => {
    const max = lineup.scrollWidth - lineup.clientWidth;
    lineup.scrollLeft = e.target.value / 1000 * max;
  });
  lineup.addEventListener('scroll', () => { if (viewAll) syncScrub(); }, { passive: true });
  $('fitBtn').addEventListener('click', () => {
    fitAll = !fitAll;
    app.classList.toggle('fit', fitAll);
    $('fitBtn').textContent = fitAll ? '放大看清楚' : '縮小看全部';
    $('hint').innerHTML = fitAll ? '全部角色一次看，按右上角可以放大' : '拖捲動條看全部，虛線是你猜的高度';
    layout(); lineup.scrollLeft = 0; syncScrub();
  });

  function updatePanel() {
    const ch = order[idx];
    $('round').textContent = viewAll ? '全員' : `${idx + 1} / ${order.length}`;
    $('fitBtn').hidden = !viewAll;
    if (!viewAll) $('scrub').hidden = true;
    if (viewAll) {
      $('who').textContent = '全員身高比較';
      $('badge').hidden = true;
      $('guessCm').textContent = order.length; $('guessCm').nextElementSibling.textContent = '位';
      $('slider').hidden = true; $('confirmBtn').hidden = true; $('nextBtn').hidden = false; $('nextBtn').textContent = '看我的成績';
      $('hint').innerHTML = '拖捲動條看全部，虛線是你猜的高度';
      return;
    }
    $('guessCm').nextElementSibling.textContent = 'cm';
    $('slider').hidden = false;
    $('who').textContent = ch.name;
    $('badge').hidden = ch.verified;
    $('slider').value = guess; $('slider').disabled = locked;
    $('guessCm').textContent = locked ? ch.heightCm : guess;
    $('guessCm').parentElement.classList.toggle('final', locked);
    $('confirmBtn').hidden = locked; $('nextBtn').hidden = !locked;
    $('nextBtn').textContent = idx === order.length - 1 ? '看結果 →' : '下一位 →';
    if (!locked) {
      $('hint').innerHTML = idx === 0 ? '拖動角色頭頂的把手，或滑動下面的滑桿' : '左邊已經站好的角色可以當參考';
    } else if (ch.verified) {
      const d = Math.abs(guesses[ch.id] - ch.heightCm);
      $('hint').innerHTML = `你猜 <b>${guesses[ch.id]}</b>，實際 <b>${ch.heightCm}</b> cm・<span class="${d <= 5 ? 'good' : 'off'}">差 ${d} cm</span>`;
    } else {
      $('guessCm').textContent = guesses[ch.id];
      $('guessCm').parentElement.classList.remove('final');
      $('hint').innerHTML = `這位的官方身高<b>待確認</b>，這題不計分（常見說法 ${ch.heightCm} cm）`;
    }
  }

  function setGuess(cm) {
    guess = clamp(Math.round(cm), MIN_GUESS, MAX_GUESS);
    $('slider').value = guess;
    $('guessCm').textContent = guess;
    layout();
  }

  /* ---------- 拖曳 ---------- */
  let dragging = false;
  lineup.addEventListener('pointerdown', e => {
    const col = e.target.closest('.col.current');
    if (!col || locked || viewAll) return;
    dragging = true; app.classList.add('dragging');
    col.setPointerCapture(e.pointerId);
    onDrag(e);
    e.preventDefault();
  });
  lineup.addEventListener('pointermove', e => { if (dragging) { onDrag(e); e.preventDefault(); } });
  const endDrag = () => { dragging = false; app.classList.remove('dragging'); };
  lineup.addEventListener('pointerup', endDrag);
  lineup.addEventListener('pointercancel', endDrag);
  function onDrag(e) {
    const y = e.clientY - (stage.getBoundingClientRect().top + stage.clientTop);
    setGuess((geo.groundY - y) / geo.pxPerCm);
  }
  $('slider').addEventListener('input', e => setGuess(+e.target.value));
  $('slider').addEventListener('pointerdown', () => app.classList.add('dragging'));
  $('slider').addEventListener('pointerup', () => app.classList.remove('dragging'));

  /* ---------- 流程 ---------- */
  function start() {
    // 出題順序：隨機，但第一題一定是有官方身高的角色
    const pool = shuffle([...PLAYABLE]);
    const first = pool.findIndex(c => c.verified);
    if (first > 0) [pool[0], pool[first]] = [pool[first], pool[0]];
    order = pool; idx = 0; guess = START_GUESS; locked = false; guesses = {}; viewAll = false; fitAll = false; app.classList.remove('fit');
    $('result').hidden = true; $('story').hidden = true; $('swipeHint').hidden = true;
    updatePanel(); build();
    lineup.scrollLeft = 0;
    track('quiz_start');
  }
  function confirmGuess() {
    if (locked) return;
    const ch = order[idx];
    guesses[ch.id] = guess;
    locked = true;
    const col = lineup.lastElementChild;
    col.classList.add('locked');
    // 把「目前」欄位換成「完成」欄位的內容，再讓它動畫長到正確身高
    col.querySelector('.tag').innerHTML = tagInner(ch);
    col.querySelector('.handle').remove();
    col.insertAdjacentHTML('beforeend', '<div class="guessline"><span></span></div>');
    requestAnimationFrame(() => layout());
    updatePanel();
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
  }
  function nextRound() {
    if (viewAll) { showResult(); return; }
    if (idx >= order.length - 1) { showResult(); return; }
    idx++; guess = START_GUESS; locked = false;
    updatePanel(); build();
    requestAnimationFrame(() => lineup.scrollTo({ left: lineup.scrollWidth, behavior: 'smooth' }));
    if (idx === 2) { $('swipeHint').hidden = false; setTimeout(() => { $('swipeHint').hidden = true; }, 3200); }
  }

  /* ---------- 結算 ---------- */
  function rankFor(avg) {
    if (avg <= 3) return '人體測量獵人：你的眼睛是尺';
    if (avg <= 6) return '職業獵人：幾乎看一眼就知道';
    if (avg <= 10) return '見習獵人：還差一點點';
    return '路人：建議回去重看一遍動畫';
  }
  function stats() {
    const scored = order.filter(c => c.verified && guesses[c.id] > 0);
    const diffs = scored.map(c => Math.abs(guesses[c.id] - c.heightCm));
    const avg = diffs.length ? diffs.reduce((a, b) => a + b, 0) / diffs.length : 0;
    return { scored, avg: Math.round(avg * 10) / 10 };
  }
  function showResult() {
    const { avg } = stats();
    $('avgErr').textContent = avg;
    $('rank').textContent = rankFor(avg);
    $('rows').innerHTML = order.map(c => {
      const g = guesses[c.id];
      if (!c.verified) return `<tr class="pend"><td>${esc(c.name)}</td><td>${g}</td><td>待確認</td><td>不計分</td></tr>`;
      const d = Math.abs(g - c.heightCm);
      return `<tr><td>${esc(c.name)}</td><td>${g}</td><td>${c.heightCm}</td><td class="${d <= 5 ? 'good' : 'off'}">${d}</td></tr>`;
    }).join('');
    $('pendingNote').textContent = PENDING_NO_HEIGHT.length
      ? `${PENDING_NO_HEIGHT.map(c => c.name).join('、')}：查不到官方身高，這版先不出題。` : '';
    $('result').hidden = false;
    track('quiz_complete', {avg_error: avg, rank: rankFor(avg)});
  }
  function showAll() {
    $('result').hidden = true;
    viewAll = true; fitAll = false; app.classList.remove('fit'); $('fitBtn').textContent = '縮小看全部';
    updatePanel(); build();
    lineup.scrollLeft = 0; requestAnimationFrame(syncScrub);
  }

  /* ---------- IG 限動圖（1080 × 1920） ---------- */
  function makeStory() {
    const W = 1080, H = 1920, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const { avg } = stats();
    const font = (w, s, f) => `${w} ${s}px ${f || "'Noto Sans TC', 'PingFang TC', sans-serif"}`;
    // 背景
    g.fillStyle = '#0d0f14'; g.fillRect(0, 0, W, H);
    const rg = g.createRadialGradient(W / 2, 0, 50, W / 2, 0, 1100); rg.addColorStop(0, 'rgba(255,210,58,.18)'); rg.addColorStop(1, 'rgba(255,210,58,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
    g.textAlign = 'center';
    g.fillStyle = '#ffd23a'; g.font = font('700', 34, "'Bebas Neue', sans-serif"); g.fillText('HUNTER × HUNTER', W / 2, 130);
    g.fillStyle = '#f2efe6'; g.font = font('900', 84); g.fillText('身高挑戰', W / 2, 230);
    g.fillStyle = '#8c93a5'; g.font = font('700', 34); g.fillText('平均誤差', W / 2, 330);
    g.fillStyle = '#ffd23a'; g.font = font('400', 190, "'Bebas Neue', 'Noto Sans TC', sans-serif"); g.fillText(avg + ' cm', W / 2, 500);
    g.fillStyle = '#f2efe6'; g.font = font('900', 46); g.fillText(rankFor(avg).split('：')[0], W / 2, 580);

    // 比例尺區
    const top = 700, ground = 1700, left = 90, right = W - 50;
    const ppc = (ground - top) / MAX_CM;
    g.textAlign = 'left';
    for (let cm = 50; cm <= MAX_CM; cm += 50) {
      const y = ground - cm * ppc;
      g.strokeStyle = 'rgba(255,255,255,.10)'; g.lineWidth = 2; g.beginPath(); g.moveTo(left, y); g.lineTo(right, y); g.stroke();
    }
    const n = order.length, colW = (right - left) / n;
    order.forEach((ch, i) => {
      const im = IMAGES[ch.id], { top: t, bottom: b } = calibOf(ch);
      const figPx = ch.heightCm * ppc, imgH = figPx / (b - t), imgW = imgH * im.w / im.h;
      const cx = left + colW * (i + .5);
      try { g.drawImage(im.el, cx - imgW / 2, ground - b * imgH, imgW, imgH); } catch (e) {}
      const gs = guesses[ch.id];
      if (gs > 0) {
        const y = ground - gs * ppc;
        g.setLineDash([12, 10]); g.strokeStyle = '#5ce1e6'; g.lineWidth = 4;
        g.beginPath(); g.moveTo(cx - colW * .4, y); g.lineTo(cx + colW * .4, y); g.stroke(); g.setLineDash([]);
      }
      g.textAlign = 'center';
      g.fillStyle = ch.verified ? '#ffd23a' : '#8c93a5';
      g.font = font('400', 34, "'Bebas Neue', 'Noto Sans TC', sans-serif");
      g.fillText(ch.verified ? String(ch.heightCm) : '?', cx, ground - figPx - 16);
      g.fillStyle = '#f2efe6'; g.font = font('700', Math.min(28, colW * .26));
      g.fillText(ch.name, cx, ground + 46);
    });
    g.fillStyle = '#ffd23a'; g.fillRect(left - 20, ground - 2, right - left + 40, 5);
    g.textAlign = 'left';
    for (let cm = 50; cm <= MAX_CM; cm += 50) {
      const y = ground - cm * ppc;
      g.fillStyle = 'rgba(13,15,20,.75)'; g.fillRect(16, y - 26, 62, 34);
      g.fillStyle = '#8c93a5'; g.font = font('400', 30, "'Bebas Neue', sans-serif"); g.fillText(String(cm), 24, y + 2);
    }
    g.textAlign = 'center';
    g.fillStyle = '#5ce1e6'; g.font = font('700', 30); g.fillText('－ － 虛線是我猜的高度', W / 2, 1820);
    g.fillStyle = '#8c93a5'; g.font = font('700', 32); g.fillText('你的眼睛有比我準嗎？', W / 2, 1875);
    try {
      const url = c.toDataURL('image/png');
      $('storyImg').src = url; $('storyDl').href = url;
      $('story').hidden = false;
    } catch (e) {
      toast('圖片產生失敗：請用網址（GitHub Pages）開啟，不要直接開本機檔案');
    }
  }

  /* ---------- 事件 ---------- */
  $('confirmBtn').addEventListener('click', confirmGuess);
  $('nextBtn').addEventListener('click', nextRound);
  $('restartBtn').addEventListener('click', () => { track('play_again'); start(); });
  $('againBtn').addEventListener('click', () => { track('play_again'); start(); });
  $('viewAllBtn').addEventListener('click', showAll);
  $('storyBtn').addEventListener('click', () => { track('score_card', {avg_error: stats().avg}); makeStory(); });
  $('storyClose').addEventListener('click', () => { $('story').hidden = true; });
  document.addEventListener('keydown', e => {
    if (!$('result').hidden || !$('story').hidden || !$('faces').hidden) return;
    if (e.key === 'ArrowUp') { e.preventDefault(); if (!locked && !viewAll) setGuess(guess + (e.shiftKey ? 10 : 1)); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); if (!locked && !viewAll) setGuess(guess - (e.shiftKey ? 10 : 1)); }
    else if (e.key === 'Enter' || e.code === 'Space') { e.preventDefault(); locked || viewAll ? nextRound() : confirmGuess(); }
  });
  // 防止雙指縮放、iOS 手勢縮放
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  // 舞台大小一變（轉向、面板高度改變、網址列收合），就重新計算比例尺，確保腳底永遠貼在地面線上
  const relayout = () => { if (!order.length) return; measure(); drawRuler(); layout(); syncScrub(); };
  if ('ResizeObserver' in window) new ResizeObserver(relayout).observe(stage);
  window.addEventListener('resize', relayout);

  /* ---------- 頭像設定：上傳臉部照片、拖曳調整位置 ---------- */
  const FACE_MAX = 600;          // 上傳的照片先縮到這個邊長，避免塞爆瀏覽器空間
  let editing = null;            // { ch, img, x, y, z, data }
  function avatarHTML(ch) {
    const im = IMAGES[ch.id];
    return `<canvas class="av" data-id="${ch.id}" width="96" height="96"></canvas>`;
  }
  async function drawAvatar(cv, ch) {
    const fi = faceInfo(ch), img = await loadFile(fi.src), g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    if (!img) { g.fillStyle = '#262c3a'; g.beginPath(); g.arc(48, 48, 46, 0, 7); g.fill(); g.fillStyle = '#8c93a5'; g.font = '900 40px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', 48, 50); return; }
    paintCrop(g, img, Object.assign({ x: .5, y: .5, z: 1 }, fi.crop), 96);
  }
  function paintCrop(g, img, cr, size) {
    const side = Math.min(img.naturalWidth, img.naturalHeight) * clamp(cr.z, .15, 1);
    const sx = clamp(cr.x * img.naturalWidth - side / 2, 0, img.naturalWidth - side);
    const sy = clamp(cr.y * img.naturalHeight - side / 2, 0, img.naturalHeight - side);
    g.save(); g.clearRect(0, 0, size, size);
    g.beginPath(); g.arc(size / 2, size / 2, size / 2 - 1, 0, 7); g.clip();
    g.drawImage(img, sx, sy, side, side, 0, 0, size, size); g.restore();
  }
  function openFaces() {
    $('faceList').innerHTML = PLAYABLE.map(ch => `<div class="face-row">${avatarHTML(ch)}
      <b>${esc(ch.name)}</b>
      <label class="btn sm">選照片<input type="file" accept="image/*" data-id="${ch.id}" hidden></label>
      <button class="btn sm" data-edit="${ch.id}">調整</button>
      <button class="btn sm ghost" data-clear="${ch.id}" aria-label="清除">✕</button></div>`).join('');
    $('faceList').querySelectorAll('.av').forEach(cv => drawAvatar(cv, ALL.find(c => c.id === cv.dataset.id)));
    $('faceEdit').hidden = true; $('faceList').hidden = false;
    $('faces').hidden = false;
  }
  async function shrink(file) {
    const url = URL.createObjectURL(file);
    const img = await loadFile(url);
    URL.revokeObjectURL(url);
    if (!img) return null;
    const k = Math.min(1, FACE_MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  }
  async function startEdit(ch, data) {
    const fi = faceInfo(ch);
    const src = data || fi.src;
    const img = await loadFile(src);
    if (!img) { toast('這位還沒有照片，先按「選照片」'); return; }
    const cr = data ? { x: .5, y: .45, z: .8 } : Object.assign({ x: .5, y: .5, z: 1 }, fi.crop);
    editing = { ch, img, data: src, x: cr.x, y: cr.y, z: cr.z };
    $('faceEditName').textContent = ch.name;
    $('faceZoom').value = Math.round((1 - editing.z) * 100);
    $('faceList').hidden = true; $('faceEdit').hidden = false;
    paintEdit();
  }
  function paintEdit() { if (editing) paintCrop($('faceCanvas').getContext('2d'), editing.img, editing, 240); }
  $('faceList').addEventListener('change', async e => {
    const inp = e.target.closest('input[type=file]'); if (!inp || !inp.files[0]) return;
    const data = await shrink(inp.files[0]);
    if (!data) { toast('這個檔案讀不到，換一張試試'); return; }
    startEdit(ALL.find(c => c.id === inp.dataset.id), data);
  });
  $('faceList').addEventListener('click', async e => {
    const ed = e.target.closest('[data-edit]'), cl = e.target.closest('[data-clear]');
    if (ed) startEdit(ALL.find(c => c.id === ed.dataset.edit));
    if (cl) {
      const f = readFaces(); delete f[cl.dataset.clear]; writeFaces(f);
      const ch = ALL.find(c => c.id === cl.dataset.clear);
      await refreshFigure(ch); drawAvatar($('faceList').querySelector(`.av[data-id="${ch.id}"]`), ch);
    }
  });
  // 拖曳照片調整臉的位置
  let pan = null;
  $('faceCanvas').addEventListener('pointerdown', e => { if (!editing) return; pan = { x: e.clientX, y: e.clientY, ox: editing.x, oy: editing.y }; $('faceCanvas').setPointerCapture(e.pointerId); e.preventDefault(); });
  $('faceCanvas').addEventListener('pointermove', e => {
    if (!pan) return;
    const im = editing.img, side = Math.min(im.naturalWidth, im.naturalHeight) * editing.z, k = side / 240;
    const half = side / 2;
    editing.x = clamp(pan.ox - (e.clientX - pan.x) * k / im.naturalWidth, half / im.naturalWidth, 1 - half / im.naturalWidth);
    editing.y = clamp(pan.oy - (e.clientY - pan.y) * k / im.naturalHeight, half / im.naturalHeight, 1 - half / im.naturalHeight);
    paintEdit();
  });
  ['pointerup', 'pointercancel'].forEach(t => $('faceCanvas').addEventListener(t, () => { pan = null; }));
  $('faceZoom').addEventListener('input', e => { if (editing) { editing.z = clamp(1 - e.target.value / 100, .15, 1); paintEdit(); } });
  $('faceSave').addEventListener('click', async () => {
    const f = readFaces();
    f[editing.ch.id] = { data: editing.data, x: +editing.x.toFixed(4), y: +editing.y.toFixed(4), z: +editing.z.toFixed(4) };
    if (!writeFaces(f)) return;
    const ch = editing.ch; editing = null;
    await refreshFigure(ch);
    openFaces(); toast(`${ch.name} 的頭像換好了`);
  });
  $('faceCancel').addEventListener('click', () => { editing = null; openFaces(); });
  $('facesBtn').addEventListener('click', openFaces);
  $('facesClose').addEventListener('click', () => { $('faces').hidden = true; });

  /* ---------- 開始 ---------- */
  $('who').textContent = '載入中…';
  Promise.all(PLAYABLE.map(ch => loadFigure(ch).then(im => { IMAGES[ch.id] = im; }))).then(() => {
    if (!PLAYABLE.length) { $('who').textContent = '沒有可以出題的角色'; return; }
    start();
  });
})();

</script>
